name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  darwin:
    name: darwin (real round-trips, CGO=0)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.4'
      - name: Vet
        run: CGO_ENABLED=0 go vet ./...
      - name: Test (CGO=0, on-device notify(3) + NSDistributedNotificationCenter round-trips)
        run: CGO_ENABLED=0 go test -count=1 -coverprofile=cover.out ./...
      - name: Coverage summary
        run: go tool cover -func=cover.out | tail -1
      - name: Race (OS-independent logic; mach-delivery tests self-skip under -race)
        run: CGO_ENABLED=1 go test -race -count=1 ./...

  linux:
    name: linux (stub build + OS-independent tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.4'
      - name: Vet
        run: CGO_ENABLED=0 go vet ./...
      - name: Build stub
        run: CGO_ENABLED=0 go build ./...
      - name: Test (stub + pure logic)
        run: CGO_ENABLED=0 go test -count=1 ./...
      - name: Race (pure logic)
        run: CGO_ENABLED=1 go test -race -count=1 ./...

  windows:
    name: windows (stub build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.4'
      - name: Build stub
        run: go build ./...
        env:
          CGO_ENABLED: '0'
      - name: Test (stub + pure logic)
        run: go test -count=1 ./...
        env:
          CGO_ENABLED: '0'
